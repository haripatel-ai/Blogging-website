<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Blog — My Personal Blogging Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <h2 class="logo">MyBlog</h2>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#new-post">Write Post</a></li>
        <li><a href="#posts-section">All Posts</a></li>
      </ul>
    </div>
  </nav>

  <!-- Header / Hero Section -->
  <header class="header" id="home">
    <div class="container">
      <h1>Welcome to My Blog</h1>
      <p>A simple blogging platform built with HTML, CSS, and JavaScript.</p>
    </div>
  </header>

  <main class="container">

    <!-- Form Section: Create New Blog Post -->
    <section class="form-section" id="new-post">
      <h2>Create a New Post</h2>
      <form id="blogForm">
        <div class="form-group">
          <label for="title">Post Title:</label>
          <input type="text" id="title" placeholder="Enter post title" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="author">Author Name:</label>
            <input type="text" id="author" placeholder="Your name" required>
          </div>

          <div class="form-group">
            <label for="category">Category:</label>
            <select id="category" required>
              <option value="Coding">Coding</option>
              <option value="College Life">College Life</option>
              <option value="Study Tips">Study Tips</option>
              <option value="Technology">Technology</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="content">Post Content:</label>
          <textarea id="content" rows="5" placeholder="Write your blog post here..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Publish Post</button>
      </form>
    </section>

    <!-- Filter & Search Section -->
    <section class="controls-section" id="posts-section">
      <div class="controls-header">
        <h2>Latest Blog Posts</h2>
        <input type="text" id="searchInput" placeholder="Search posts by title or keyword...">
      </div>

      <!-- Category Filter Buttons -->
      <div class="category-buttons">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Coding">Coding</button>
        <button class="filter-btn" data-category="College Life">College Life</button>
        <button class="filter-btn" data-category="Study Tips">Study Tips</button>
        <button class="filter-btn" data-category="Technology">Technology</button>
      </div>
    </section>

    <!-- Blog Posts Container -->
    <section class="posts-container" id="postsList">
      <!-- Posts will be dynamically inserted here using JavaScript -->
    </section>

    <!-- Message when no posts are found -->
    <p id="noPostsMessage" class="no-posts-text" style="display: none;">No posts found matching your search.</p>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Student Blog Project | Built using HTML, CSS & JavaScript</p>
  </footer>

  <!-- Link to JavaScript File -->
  <script src="app.js"></script>
</body>
</html>
